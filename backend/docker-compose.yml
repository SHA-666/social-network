services:
  db:                      
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Zone01pc
      MYSQL_DATABASE: new_schema
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    environment:
      MYSQL_HOST: db           
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MY_SQLPW: Zone01pc
      MYSQL_DB: new_schema
    ports:
      - "8080:8080"
    depends_on:
      - db
